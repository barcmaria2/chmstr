<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Справочные таблицы · Химия · Pomogator.med</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  /* стили, специфичные только для этой страницы (не дублируются больше нигде) */
  .instruction{ font-size:0.95rem; color:var(--text-secondary); margin-bottom:14px; text-align:center; }
  select{
    width:100%; padding:11px; border:2px solid #cbd5e1; border-radius:9px; font-size:1rem;
    color:var(--text-primary); outline:none; background:#f8fafc; cursor:pointer; margin-bottom:18px; font-family:inherit;
  }
  select:focus{ border-color:var(--blue-med); background:#fff; }
  #result-box{
    display:none; background:var(--blue-pale); padding:18px; border-radius:9px;
    border:2px solid #dbe6fb; font-size:1.02rem; line-height:1.6;
  }
  .result-item{ margin-bottom:8px; }
  .result-val{ font-weight:800; color:var(--blue-dark); }
  .content-title{ text-align:center; }
</style>
</head>
<body>
<div id="app">

  <div class="crumb">
    <a href="index.html">Химия</a><span class="sep">/</span><span>Таблицы</span>
  </div>

  <div class="header">
    <h1>Справочные таблицы</h1>
    <div class="subtitle">Бесплатный справочник для занятий · Помогатор <span class="plus">PLUS</span></div>
  </div>

  <div id="menu" class="view active">

    <a href="https://t.me/pomogator_pimu" target="_blank" class="tg-btn">🎀 Telegram-канал «Маша в меде»</a>

    <a href="https://t.me/pomogator_pimu" target="_blank" class="premium-btn">
      <div class="premium-title">👑 Помогатор PLUS</div>
      <div class="premium-desc">Понравились таблицы? Полная «Интерактивная химия» (занятия 1–10) с разборами задач и тестами — в подписке. ✨</div>
    </a>

    <div class="menu-grid">
      <button class="btn" onclick="openTable('table2')"><span class="btn-label"><span>Таблица 2. Коэффициенты активности ионов</span></span><span>➔</span></button>
      <button class="btn" onclick="openTable('table3')"><span class="btn-label"><span>Таблица 3. Термодинамические параметры</span></span><span>➔</span></button>
      <button class="btn" onclick="openTable('table4')"><span class="btn-label"><span>Таблица 4. Кинетические характеристики реакций</span></span><span>➔</span></button>
      <button class="btn" onclick="openTable('table5')"><span class="btn-label"><span>Таблица 5. Константы ионизации оснований (Kb)</span></span><span>➔</span></button>
      <button class="btn" onclick="openTable('table6')"><span class="btn-label"><span>Таблица 6. Константы ионизации кислот (Ka)</span></span><span>➔</span></button>
      <button class="btn" onclick="openTable('table7')"><span class="btn-label"><span>Таблица 7. Константы растворимости (Ks)</span></span><span>➔</span></button>
      <button class="btn" onclick="openTable('table8')"><span class="btn-label"><span>Таблица 8. Стандартные электродные потенциалы</span></span><span>➔</span></button>
    </div>
  </div>

  <div id="table-view" class="view">
    <button class="btn btn-back" onclick="closeTable()">⬅ Вернуться к списку таблиц</button>
    <div class="content-box">
      <div id="table-title" class="content-title"></div>
      <div id="table-instruction" class="instruction"></div>
      <div id="group-buttons" style="display:none; flex-wrap:wrap; gap:8px; margin-bottom:20px;"></div>
      <select id="element-select" onchange="showElementInfo()" style="display:none;">
        <option value="" disabled selected>-- Выберите элемент --</option>
      </select>
      <div id="result-box"></div>
    </div>
  </div>

</div>
<script src="tables-data.js"></script>
</body>
</html>
